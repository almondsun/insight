name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify reviewed provenance and versions
        shell: bash
        env:
          EXPECTED_VERSION: ${{ github.ref_name }}
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          [[ "$EXPECTED_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-preview\.[0-9]+)?$ ]]
          EXPECTED_VERSION="${EXPECTED_VERSION#v}" node -e "const p=require('./package.json'); if(p.version !== process.env.EXPECTED_VERSION) process.exit(1)"
          expected="${EXPECTED_VERSION#v}"
          bundle_version="$expected"
          if [[ "$expected" =~ ^([0-9]+\.[0-9]+\.[0-9]+)-preview\.([0-9]+)$ ]]; then
            test "${BASH_REMATCH[2]}" -le 65535
            bundle_version="${BASH_REMATCH[1]}-${BASH_REMATCH[2]}"
          fi
          grep -F "version=\"$expected\"" src-tauri/Cargo.toml
          grep -F "\"version\":\"$bundle_version\"" src-tauri/tauri.conf.json
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run tauri build -- --target ${{ matrix.target }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: installers-${{ matrix.target }}
          if-no-files-found: error
          retention-days: 7
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*-setup.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.AppImage
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.rpm

  publish:
    name: Verify and publish release
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: installers-*
          path: artifacts
          merge-multiple: true
      - name: Verify exact installer manifest and checksums
        shell: bash
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          test "$(find artifacts -type f -name '*x64*.msi' | wc -l)" -eq 1
          test "$(find artifacts -type f -name '*x64*-setup.exe' | wc -l)" -eq 1
          test "$(find artifacts -type f -name '*aarch64*.dmg' | wc -l)" -eq 1
          test "$(find artifacts -type f -name '*amd64*.AppImage' | wc -l)" -eq 1
          test "$(find artifacts -type f -name '*amd64*.deb' | wc -l)" -eq 1
          test "$(find artifacts -type f -name '*x86_64*.rpm' | wc -l)" -eq 1
          test "$(find artifacts -type f | wc -l)" -eq 6
          mkdir release-assets
          find artifacts -type f -exec cp --no-clobber '{}' release-assets/ \;
          test "$(find release-assets -maxdepth 1 -type f | wc -l)" -eq 6
          cd release-assets
          sha256sum * | LC_ALL=C sort -k2 > SHA256SUMS
      - name: Create clean GitHub release
        shell: bash
        run: |
          if [[ "$RELEASE_TAG" == *-* ]]; then
            notes_file="docs/releases/${RELEASE_TAG}.md"
            test -f "$notes_file" || { echo "Missing release notes: $notes_file" >&2; exit 1; }
            gh release create "$RELEASE_TAG" release-assets/* --verify-tag --prerelease --title "insIGht $RELEASE_TAG" --notes-file "$notes_file"
          else
            gh release create "$RELEASE_TAG" release-assets/* --verify-tag --draft --title "insIGht $RELEASE_TAG" --notes "Draft stable release. Complete manual platform verification before publishing."
          fi
