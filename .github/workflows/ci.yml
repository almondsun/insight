name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev
      - run: npm run build
      - run: npm test

  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install Linux dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: src-tauri
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - run: cargo fmt --manifest-path crates/fame-core/Cargo.toml --check
      - run: cargo clippy --manifest-path crates/fame-core/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path crates/fame-core/Cargo.toml --locked
      - run: cargo fmt --manifest-path tools/fame-lab/Cargo.toml --check
      - run: cargo clippy --manifest-path tools/fame-lab/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path tools/fame-lab/Cargo.toml --locked
      - run: cargo run --manifest-path tools/fame-lab/Cargo.toml --locked -- corpus --input lab/fame/fixtures/corpus.json
      - run: cargo run --manifest-path tools/fame-lab/Cargo.toml --locked -- scheduler --manifest lab/fame/fixtures/manifest.json --tuple lab/fame/fixtures/tuple.json --username synthetic_alice
